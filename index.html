<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About You</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Latar Belakang Blur */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('IMG-20261001-WA0014.jpg') center/cover no-repeat;
            filter: blur(12px) brightness(0.4);
            z-index: -1;
        }

        .slide-hint {
            position: absolute;
            top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            z-index: 10;
        }

        .slider-container {
            width: 90%;
            max-width: 380px;
            height: 85vh;
            overflow-x: auto;
            display: flex;
            snap-type: x mandatory;
            scroll-behavior: smooth;
            border-radius: 20px;
        }

        .slider-container::-webkit-scrollbar {
            display: none;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* MUSIC PLAYER DENGAN ANIMASI POSISI */
        .music-card-wrapper {
            position: absolute;
            width: 85%;
            max-width: 330px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
            /* Posisi awal di tengah */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Saat diputar, musik pindah ke pojok kiri atas dan mengecil */
        .music-card-wrapper.playing-mode {
            top: 15px;
            left: 15px;
            transform: translate(0, 0) scale(0.38);
            transform-origin: top left;
            opacity: 0.9;
        }

        .music-card {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .album-art {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            object-fit: cover;
            height: 250px;
        }

        .song-details h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .song-details p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 15px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #b3b3b3;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 70%;
            height: 4px;
            background: #4d4d4d;
            border-radius: 2px;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .controls i {
            font-size: 18px;
            cursor: pointer;
            color: #ffffff;
        }

        .play-btn {
            background: #ffffff;
            color: #000000 !important;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px !important;
            cursor: pointer;
        }

        /* Photo Card & Chat Bubbles */
        .photo-card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 40px;
            gap: 10px;
        }
