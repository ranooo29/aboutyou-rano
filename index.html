<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About You</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Latar Belakang menggunakan salah satu foto Anda */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('IMG-20261001-WA0014.jpg') center/cover no-repeat;
            filter: blur(12px) brightness(0.4);
            z-index: -1;
        }

        .slide-hint {
            position: absolute;
            top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            z-index: 10;
        }

        .slider-container {
            width: 90%;
            max-width: 380px;
            height: 85vh;
            overflow-x: auto;
            display: flex;
            snap-type: x mandatory;
            scroll-behavior: smooth;
            border-radius: 20px;
        }

        .slider-container::-webkit-scrollbar {
            display: none;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Music Player */
        .music-card {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .album-art {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            object-fit: cover;
            height: 250px;
        }

        .song-details h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .song-details p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 15px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #b3b3b3;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 70%;
            height: 4px;
            background: #4d4d4d;
            border-radius: 2px;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .controls i {
            font-size: 18px;
            cursor: pointer;
            color: #ffffff;
        }

        .play-btn {
            background: #ffffff;
            color: #000000 !important;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px !important;
            cursor: pointer;
        }

        /* Photo Card & Chat Bubbles */
        .photo-card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 15px;
            gap: 8px;
        }

        .chat-bubble {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 12px;
            max-width: 90%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .bubble-1 {
            align-self: flex-start;
        }

        .bubble-2 {
            align-self: center;
            background: rgba(255, 255, 255, 0.3);
        }

        .bubble-3 {
            align-self: flex-end;
        }

        .main-photo {
            width: 100%;
            border-radius: 15px;
            object-fit: cover;
            max-height: 280px;
            margin-top: 5px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .aesthetic-text {
            font-family: 'Dancing Script', cursive;
            font-size: 28px;
            text-align: center;
            margin-top: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="slide-hint">Geser Kiri <i class="fa-solid fa-chevron-right"></i></div>

    <div class="slider-container">
        
        <!-- SLIDE 1: MUSIK -->
        <div class="slide">
            <div class="music-card">
                <!-- Cover album pakai foto pertama -->
                <img src="IMG-20261001-WA0014.jpg" alt="Album Cover" class="album-art">
                
                <div class="song-details">
                    <h2>About You</h2>
                    <p>The 1975</p>
                </div>

                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="duration">1:00</span>
                </div>

                <div class="controls">
                    <i class="fa-solid fa-volume-high"></i>
                    <i class="fa-solid fa-backward-step"></i>
                    <div class="play-btn" onclick="togglePlay()">
                        <i class="fa-solid fa-play" id="playIcon"></i>
                    </div>
                    <i class="fa-solid fa-forward-step"></i>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
        </div>

        <!-- SLIDE 2: FOTO & 3 BUBBLE CHAT -->
        <div class="slide">
            <div class="photo-card">
                <div class="chat-bubble bubble-1">tidak ada satupun yang kekal</div>
                <div class="chat-bubble bubble-2">maka ukirlah cerita indah sebagai kenangan</div>
                <div class="chat-bubble bubble-3">karena didunia memang sebuah cerita</div>

                <!-- Menggunakan salah satu foto pilihan Anda -->
                <img src="IMG_20261015_175351.jpg" alt="Foto" class="main-photo">
                
                <div class="aesthetic-text">Know a place</div>
            </div>
        </div>

    </div>

    <!-- File musik sesuai permintaan -->
    <audio id="audio" src="ssstik.io_1792058518920.mp3"></audio>

    <script>
        const audio = document.getElementById('audio');
        const playIcon = document.getElementById('playIcon');
        const progress = document.getElementById('progress');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
            }
        }

        audio.ontimeupdate = function() {
            if (audio.duration) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                progress.style.width = percentage + '%';
            }
        };
    </script>
</body>
</html>
